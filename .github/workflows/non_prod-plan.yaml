name: Non-Prod Plan

on:
  pull_request:
    branches: [develop]
    paths:
      - 'application/environments/dev/**'
      - 'application/infrastructure/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resource: [cloud_storage, apis]
      fail-fast: false
    defaults:
      run:
        working-directory: application/infrastructure/${{ matrix.resource }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init -backend-config=../../environments/dev/${{ matrix.resource }}.hcl

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=../../environments/dev/${{ matrix.resource }}.tfvars -no-color