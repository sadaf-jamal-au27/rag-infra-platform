name: Non-Prod Plan

on:
  pull_request:
    branches: [develop]
    paths:
      - 'application/environments/dev/**'
      - 'application/infrastructure/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # ─────────────────────────────────────────────
  # Git diff se pata karo kaunse resource folders change hue
  # Koi hardcoded filter list nahi — purely dynamic
  # ─────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # poori git history chahiye diff nikalne ke liye

      - name: Detect changed resource folders
        id: detect
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          changed_files=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$changed_files"

          # Do jagah se resource naam nikal sakte hain:
          # 1. application/infrastructure/<resource>/...
          # 2. application/environments/dev/<resource>.hcl ya .tfvars
          resources=$(echo "$changed_files" | grep -oE 'application/infrastructure/[^/]+' | sed 's|application/infrastructure/||' ; \
                      echo "$changed_files" | grep -oE 'application/environments/dev/[^./]+\.(hcl|tfvars)' | sed -E 's|.*/([^./]+)\.(hcl|tfvars)|\1|')

          matrix=$(echo "$resources" | sort -u | grep -v '^$' | jq -R -s -c 'split("\n")[:-1]')

          if [ "$matrix" = "[]" ] || [ -z "$matrix" ]; then
            matrix="[]"
          fi

          echo "Detected resources: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resource: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    defaults:
      run:
        working-directory: application/infrastructure/${{ matrix.resource }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init -backend-config=../../environments/dev/${{ matrix.resource }}.hcl

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=../../environments/dev/${{ matrix.resource }}.tfvars -no-color